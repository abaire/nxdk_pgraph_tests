name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  CheckClangFormat:
    name: Check clang-format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-19
      - name: Clone tree
        uses: actions/checkout@v7
      - name: Run clang-format
        run: |
          clang-format --version
          find src \
              -iname "*.h" -o -iname "*.cpp" \
              -exec clang-format -n -Werror {} \+;

  BuildISO:
    name: Build ISO
    runs-on: ubuntu-latest
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            llvm \
            lld \
            libsdl2-dev \
            libsdl2-image-dev \
            ninja-build
          pip3 install nv2a-vsh

      - name: Get NXDK submodule commit
        id: nxdk-ref
        run: echo "sha=$(git rev-parse HEAD:third_party/nxdk)" >> $GITHUB_OUTPUT

      - name: Cache prewarmed NXDK
        id: cache-nxdk
        uses: actions/cache@v6
        with:
          path: |
            third_party/nxdk/lib
            third_party/nxdk/tools
          key: ${{ runner.os }}-nxdk-${{ steps.nxdk-ref.outputs.sha }}-${{ hashFiles('prewarm-nxdk.sh') }}

      - name: Prewarm nxdk
        if: steps.cache-nxdk.outputs.cache-hit != 'true'
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          bash ${GITHUB_WORKSPACE}/prewarm-nxdk.sh

      - name: Compile
        run: |
          export NXDK_DIR="${GITHUB_WORKSPACE}/third_party/nxdk"
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${NXDK_DIR}/share/toolchain-nxdk.cmake"
          cmake --build build -- -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nxdk_pgraph_tests_xiso.iso
          path: build/src/xiso/nxdk_pgraph_tests_xiso/nxdk_pgraph_tests_xiso.iso

  CreateRelease:
    needs: [ BuildISO ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          path: nxdk_pgraph_tests

      - name: Calculate version
        id: calculate-version
        run: |
          echo "version=$(date +'%Y-%m-%d_%H-%M-%S-%N')" >> $GITHUB_OUTPUT

      - name: Create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.calculate-version.outputs.version }}

      - uses: actions/download-artifact@v8
        with:
          name: nxdk_pgraph_tests_xiso.iso
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: "NV2A PGRAPH tests ${{ steps.tag_version.outputs.new_version }}"
          prerelease: false
          draft: false
          files: |
            nxdk_pgraph_tests_xiso.iso

  DeployDocs:
    runs-on: ubuntu-latest
    needs: [BuildISO]
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Doxygen and Graphviz
        run: sudo apt-get install doxygen graphviz
      - name: Generate docs
        run: cmake -S . -B build && cmake --build build --verbose -- doc
      - name: Generate nxdk_pgrapg_tests_registry
        run: python3 .github/scripts/summarize_test_suites.py xml
      - name: Create 'pages_doxygen' branch
        run: |
          git fetch origin --no-recurse-submodules
          git checkout main
          git pull
          git checkout pages_doxygen || git checkout -b pages_doxygen
          git rebase main
      - name: Add and commit documentation changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add docs/*
          git add xml/*
          git config --local user.email "$GITHUB_ACTOR+github-actions@users.noreply.github.com"
          git config --local user.name "$GITHUB_ACTOR via action"
          git commit -m "Update Doxygen documentation" || echo "No changes to commit"
          git push --set-upstream origin pages_doxygen -f

  BuildMacOS:
    name: Build macOS
    runs-on: macOS-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install \
            coreutils \
            llvm@19 \
            lld@19
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r requirements.txt

      - name: Get NXDK submodule commit
        id: nxdk-ref
        run: echo "sha=$(git rev-parse HEAD:third_party/nxdk)" >> $GITHUB_OUTPUT

      - name: Cache prewarmed NXDK
        id: cache-nxdk
        uses: actions/cache@v6
        with:
          path: |
            third_party/nxdk/lib
            third_party/nxdk/tools
          key: ${{ runner.os }}-nxdk-${{ steps.nxdk-ref.outputs.sha }}-${{ hashFiles('prewarm-nxdk.sh') }}

      - name: Prewarm nxdk
        if: steps.cache-nxdk.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix llvm@19)/bin:$(brew --prefix lld@19)/bin:$PATH"
          export LDFLAGS="-L/opt/homebrew/opt/llvm@19/lib/c++ -L/opt/homebrew/opt/llvm@19/lib -L/opt/homebrew/opt/lld@19/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/lld@19/include"
          clang --version
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          bash ${GITHUB_WORKSPACE}/prewarm-nxdk.sh

      - name: Compile in dump mode
        run: |
          # The default clang install will result in linker failures on macOS.
          export PATH="$(brew --prefix llvm@19)/bin:$(brew --prefix lld@19)/bin:$PATH"
          export LDFLAGS="-L/opt/homebrew/opt/llvm@19/lib/c++ -L/opt/homebrew/opt/llvm@19/lib -L/opt/homebrew/opt/lld@19/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/lld@19/include"
          export NXDK_DIR="${GITHUB_WORKSPACE}/third_party/nxdk"
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${NXDK_DIR}/share/toolchain-nxdk.cmake" \
                -DDUMP_CONFIG_FILE=ON
          cmake --build build -- -j

      - name: Compile in run mode
        run: |
          # The default clang install will result in linker failures on macOS.
          export PATH="$(brew --prefix llvm@19)/bin:$(brew --prefix lld@19)/bin:$PATH"
          export LDFLAGS="-L/opt/homebrew/opt/llvm@19/lib/c++ -L/opt/homebrew/opt/llvm@19/lib -L/opt/homebrew/opt/lld@19/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/lld@19/include"
          export NXDK_DIR="${GITHUB_WORKSPACE}/third_party/nxdk"
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${NXDK_DIR}/share/toolchain-nxdk.cmake" \
                -DDUMP_CONFIG_FILE=OFF
          cmake --build build -- -j


  TestMacOS:
    name: Test macOS
    runs-on: macOS-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install \
            coreutils \
            llvm@19 \
            lld@19

      - name: Compile and test in dump mode
        run: |
          # The default clang install will result in linker failures on macOS.
          export PATH="$(brew --prefix llvm@19)/bin:$PATH"
          cmake -B build-dump-mode \
                -DCMAKE_BUILD_TYPE=Release \
                -DDUMP_CONFIG_FILE=ON
          cmake --build build-dump-mode -- -j
          cmake --build build-dump-mode --target test

      - name: Compile and test in run mode
        run: |
          # The default clang install will result in linker failures on macOS.
          export PATH="$(brew --prefix llvm@19)/bin:$PATH"
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DDUMP_CONFIG_FILE=OFF
          cmake --build build -- -j
          cmake --build build --target test -- -j
